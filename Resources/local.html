<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay</title>
<link rel="icon" href="data:,">
<style>
 :root {
  color-scheme: light dark;
  --page: #fafbfe;
  --text: #172238;
  --muted: #546278;
  --line: #e1e6ef;
  --subtle: #eff3fa;
  --accent: #214cc8;
  --on-accent: #fff;
  --error: #b02334;
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  background: var(--page);
  color: var(--text);
 }
 @media (prefers-color-scheme: dark) {
  :root {
   --page: #12151d;
   --text: #edf1fb;
   --muted: #a9b4c9;
   --line: #323948;
   --subtle: #202737;
   --accent: #a4baff;
   --on-accent: #152143;
   --error: #ffa4ad;
  }
 }
 [hidden] { display: none !important; }
 * { box-sizing: border-box; }
 body { max-width: 560px; margin: 0 auto; padding: 46px 22px 32px; }
 h1, h2, p { margin: 0; }
 h1 { font-size: 1.5rem; font-weight: 680; letter-spacing: -.04em; }
 h2 { font-size: 1.05rem; font-weight: 650; letter-spacing: -.015em; }
 .masthead, .brand, .section-heading, .file, .action, footer {
  display: flex; align-items: center;
 }
 .masthead { justify-content: space-between; gap: 12px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
 .brand { gap: 10px; }
 .brand-mark { width: 36px; height: 36px; flex: none; border-radius: 11px; }
 .connection { font-size: .8rem; color: var(--muted); white-space: nowrap; }
 section { padding: 24px 0; border-bottom: 1px solid var(--line); }
 .section-heading { justify-content: space-between; gap: 12px; margin-bottom: 10px; }
 .count, .size, .muted, footer, .help { font-size: .85rem; color: var(--muted); }
 .count:empty, #status:empty { display: none; }
 .file-list { list-style: none; margin: 0; padding: 0; }
 .file { gap: 12px; padding: 12px 0; }
 .file + .file { border-top: 1px solid var(--line); }
 .file-icon {
  display: grid; place-items: center; flex: none; width: 38px; height: 38px;
  border-radius: 9px; color: var(--accent); background: var(--subtle);
 }
 .icon { width: 17px; height: 17px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
 .meta { flex: 1; min-width: 0; }
 .name { font-size: .94rem; font-weight: 600; overflow-wrap: anywhere; }
 .size { margin-top: 2px; font-variant-numeric: tabular-nums; }
 .message { padding: 7px 0; font-size: .9rem; overflow-wrap: anywhere; }
 .action {
  display: inline-flex; justify-content: center; gap: 7px; flex: none;
  min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 9px;
  background: transparent; color: var(--accent); font: inherit; font-size: .86rem;
  font-weight: 620; text-decoration: none; white-space: nowrap; cursor: pointer;
 }
 .action:hover { background: var(--subtle); }
 .action:focus-visible, .pick:focus-within, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
 .pick { position: relative; margin-top: 12px; padding-inline: 15px; background: var(--accent); color: var(--on-accent); border-color: transparent; }
 .pick:hover { background: var(--accent); }
 .pick:has(input:disabled) { opacity: .55; cursor: default; }
 .pick input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: inherit; }
 .help { margin-top: 10px; }
 .help p { margin-top: 6px; }
 summary { width: fit-content; cursor: pointer; }
 progress { display: block; width: 100%; height: 7px; margin: 16px 0 8px; accent-color: var(--accent); }
 #status { margin-top: 10px; font-size: .88rem; overflow-wrap: anywhere; }
 #retry, #retryFiles { margin-top: 10px; }
 .error { color: var(--error); }
 footer { gap: 7px; margin-top: 18px; }
 @media (max-width: 380px) {
  body { padding-inline: 16px; }
  .file { gap: 8px; }
  .file-icon { width: 32px; height: 32px; }
  .action { padding-inline: 9px; }
 }
 @media (max-width: 600px) { body { padding-top: 26px; } }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
 <symbol id="document-icon" viewBox="0 0 24 24"><path d="M13.5 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8.5L13.5 3Z"/><path d="M13 3v6h6"/></symbol>
 <symbol id="download-icon" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M5 17v3h14v-3"/></symbol>
 <symbol id="upload-icon" viewBox="0 0 24 24"><path d="M12 16V4m-4 4 4-4 4 4M5 17v3h14v-3"/></symbol>
</svg>
<header class="masthead">
 <div class="brand">
  <svg class="brand-mark" viewBox="0 0 36 36" aria-hidden="true">
   <rect width="36" height="36" rx="11" fill="#214cc8"/>
   <path d="M9 14h17m-5-5 5 5-5 5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
   <path d="M27 22H10m5-5-5 5 5 5" fill="none" stroke="#b4e6ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1>Relay</h1>
 </div>
 <span class="connection">Local Wi-Fi</span>
</header>
<main>
 <section aria-labelledby="download-heading">
  <div class="section-heading"><h2 id="download-heading">From the Mac</h2><span id="fileCount" class="count"></span></div>
  <ul id="files" class="file-list" aria-live="polite"><li class="message muted">Loading files…</li></ul>
  <button id="retryFiles" class="action" type="button" hidden>Reload files</button>
  <details id="downloadHelp" class="help" hidden>
   <summary>Download help</summary>
   <p>If a download stops, check your browser’s downloads for a retry or resume option.</p>
  </details>
 </section>
 <section aria-labelledby="upload-heading">
  <h2 id="upload-heading">Send to the Mac</h2>
  <p id="uploadHint" class="message muted">Checking the receiving folder…</p>
  <label class="action pick" id="pick" hidden>
   <svg class="icon" aria-hidden="true"><use href="#upload-icon"/></svg>Choose files
   <input type="file" id="upload" aria-label="Choose files to send to the Mac" multiple disabled>
  </label>
  <progress id="progress" max="100" value="0" hidden aria-label="Upload progress"></progress>
  <p id="status" role="status" aria-live="polite"></p>
  <button id="retry" class="action" type="button" hidden>Retry upload</button>
 </section>
</main>
<footer>Keep this session link private.</footer>
<template id="fileRow">
 <li class="file">
  <span class="file-icon" aria-hidden="true"><svg class="icon"><use href="#document-icon"/></svg></span>
  <div class="meta"><div class="name"></div><div class="size"></div></div>
  <a class="action"><svg class="icon" aria-hidden="true"><use href="#download-icon"/></svg>Download</a>
 </li>
</template>
<!-- relay:session-data -->
<script>
'use strict';
const base = location.pathname.replace(/\/$/, '');
const status = document.getElementById('status');
const retryFiles = document.getElementById('retryFiles');
const fileList = document.getElementById('files');
const fileCount = document.getElementById('fileCount');
const downloadHelp = document.getElementById('downloadHelp');
const uploadHint = document.getElementById('uploadHint');
const pick = document.getElementById('pick');

function formatSize(bytes) {
 if (bytes < 1024) return `${bytes} B`;
 const units = ['KiB', 'MiB', 'GiB', 'TiB'];
 let unit = 0;
 let size = bytes / 1024;
 while (size >= 1024 && unit < units.length - 1) {
  size /= 1024;
  unit++;
 }
 return `${size.toFixed(1)} ${units[unit]}`;
}

function showFileMessage(text, isError = false) {
 const item = document.createElement('li');
 item.className = isError ? 'message error' : 'message muted';
 item.textContent = text;
 fileList.replaceChildren(item);
}

function showFiles(files) {
 fileCount.textContent = files.length ? `${files.length} ${files.length === 1 ? 'file' : 'files'}` : '';
 downloadHelp.hidden = !files.length;
 if (!files.length) {
  showFileMessage('No files shared from this Mac.');
  return;
 }
 const rows = document.createDocumentFragment();
 const template = document.getElementById('fileRow');
 for (const file of files) {
  const row = template.content.cloneNode(true);
  row.querySelector('.name').textContent = file.name;
  row.querySelector('.size').textContent = formatSize(file.size);
  const download = row.querySelector('a');
  download.href = base + '/files/' + encodeURIComponent(file.id);
  download.download = file.name;
  download.setAttribute('aria-label', 'Download ' + file.name);
  rows.append(row);
 }
 fileList.replaceChildren(rows);
}

function showSession(data) {
 showFiles(data.files);
 uploadHint.textContent = data.canUpload ? '' : 'Choose a receiving folder in Relay on your Mac.';
 uploadHint.hidden = data.canUpload;
 pick.hidden = !data.canUpload;
 uploadInput.disabled = !data.canUpload;
}

async function load() {
 retryFiles.hidden = true;
 try {
  const response = await fetch(base + '/api', {cache: 'no-store'});
  if (!response.ok) throw new Error('This session is unavailable. Open the current link from Relay.');
  showSession(await response.json());
 } catch (error) {
  fileCount.textContent = '';
  downloadHelp.hidden = true;
  showFileMessage(error.message, true);
  uploadHint.textContent = 'Reconnect to Relay to check the receiving folder.';
  retryFiles.hidden = false;
 }
}
retryFiles.addEventListener('click', load);
window.addEventListener('online', () => { if (!retryFiles.hidden) load(); });
const uploadInput = document.getElementById('upload');
const retryButton = document.getElementById('retry');
const progressBar = document.getElementById('progress');
const uploadChunkSize = 8 * 1024 * 1024;
const uploadLimit = 20 * 1024 * 1024 * 1024;
let pendingUploads = [];
let uploading = false;

function newUploadID() {
 const random = crypto.getRandomValues(new Uint8Array(16));
 const hex = Array.from(random, byte => byte.toString(16).padStart(2, '0')).join('');
 return [hex.slice(0, 8), hex.slice(8, 12), hex.slice(12, 16), hex.slice(16, 20), hex.slice(20)].join('-');
}

class UploadError extends Error {
 constructor(message, retryable = false) {
  super(message);
  this.retryable = retryable;
 }
}

function uploadRequest(query, body, onProgress) {
 return new Promise((resolve, reject) => {
  const xhr = new XMLHttpRequest();
  let timer;
  const touch = () => {
   clearTimeout(timer);
   timer = setTimeout(() => xhr.abort(), 45000);
  };
  const parameters = Object.entries(query).map(([key, value]) => encodeURIComponent(key) + '=' + encodeURIComponent(value)).join('&');
  xhr.open(body === undefined ? 'GET' : 'POST', base + '/upload?' + parameters);
  xhr.setRequestHeader('X-Relay-Upload', '1');
  if (body !== undefined) xhr.setRequestHeader('Content-Type', 'application/octet-stream');
  xhr.upload.onprogress = event => {
   touch();
   if (onProgress) onProgress(event.loaded);
  };
  xhr.upload.onload = touch;
  xhr.onprogress = touch;
  xhr.onloadend = () => clearTimeout(timer);
  xhr.onload = () => {
   if (xhr.status !== 200) {
    const message = xhr.status === 404 ? 'This session ended. Open the current link from Relay.' : xhr.responseText;
    reject(new UploadError(message || 'The upload failed.', xhr.status === 408 || xhr.status === 503));
    return;
   }
   try { resolve(JSON.parse(xhr.responseText)); }
   catch { reject(new UploadError('The Mac returned an invalid response.')); }
  };
  xhr.onerror = xhr.onabort = () => reject(new UploadError('Connection lost. Reconnect to Wi-Fi and retry.', true));
  touch();
  try { xhr.send(body); }
  catch (error) { clearTimeout(timer); reject(error); }
 });
}

function checkedOffset(result, total) {
 if (result.busy) throw new UploadError('Waiting for the previous connection to close.', true);
 if (!Number.isSafeInteger(result.offset) || result.offset < 0 || result.offset > total) {
  throw new UploadError('The Mac returned an invalid upload position.');
 }
 return result.offset;
}

async function uploadFile(job) {
 const {file, id} = job;
 let recover = job.started;
 let failures = 0;
 let offset = 0;
 while (true) {
  try {
   if (recover) {
    const state = await uploadRequest({id});
    offset = checkedOffset(state, file.size);
    if (state.savedAs) return state.savedAs;
    recover = false;
   }
   const end = Math.min(offset + uploadChunkSize, file.size);
   status.textContent = `Sending ${file.name}…`;
   progressBar.value = file.size ? offset / file.size * 100 : 0;
   job.started = true;
   const result = await uploadRequest(
    {name: file.name, id, total: file.size, offset},
    file.slice(offset, end),
    bytes => { if (file.size) progressBar.value = Math.min(100, (offset + bytes) / file.size * 100); }
   );
   const next = checkedOffset(result, file.size);
   if (result.savedAs) return result.savedAs;
   if (next === offset) throw new UploadError('The upload did not advance.', true);
   offset = next;
   failures = 0;
  } catch (error) {
   if (!error.retryable || failures >= 7) throw error;
   const delay = Math.min(1000 * 2 ** failures++, 12000);
   status.textContent = `Reconnecting to finish ${file.name}…`;
   await new Promise(resolve => setTimeout(resolve, delay));
   recover = true;
  }
 }
}

async function uploadBatch() {
 if (uploading || !pendingUploads.length) return;
 uploading = true;
 uploadInput.disabled = true;
 retryButton.hidden = true;
 progressBar.hidden = false;
 status.className = '';
 try {
  while (pendingUploads.length) {
   const saved = await uploadFile(pendingUploads[0]);
   pendingUploads.shift();
   progressBar.value = 100;
   status.textContent = `Saved on your Mac: ${saved}`;
  }
  progressBar.hidden = true;
 } catch (error) {
  status.textContent = error.message;
  status.className = 'error';
  retryButton.hidden = false;
 } finally {
  uploading = false;
  uploadInput.disabled = false;
 }
}

uploadInput.addEventListener('change', event => {
 const selected = Array.from(event.target.files);
 if (!selected.length) return;
 if (selected.some(file => file.size > uploadLimit)) {
  status.textContent = 'Choose files up to 20 GiB each.';
  status.className = 'error';
  uploadInput.value = '';
  return;
 }
 pendingUploads = selected.map(file => ({file, id: newUploadID(), started: false}));
 uploadInput.value = '';
 uploadBatch();
});
retryButton.addEventListener('click', uploadBatch);
const initialSession = document.getElementById('session-data');
if (initialSession) {
 try { showSession(JSON.parse(initialSession.textContent)); }
 catch { load(); }
} else {
 load();
}
</script></body></html>
